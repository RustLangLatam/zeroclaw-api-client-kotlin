name: Release

# A tag vX.Y.Z on main publishes that version to Maven Central (Central
# Portal), signed. Needs the repository secrets MAVEN_CENTRAL_USERNAME and
# MAVEN_CENTRAL_PASSWORD (a Central Portal user token) and SIGNING_KEY and
# SIGNING_KEY_PASSWORD (an ASCII-armored PGP key whose public half is on a
# keyserver).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/io.github.rustlanglatam/zeroclaw-api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag matches the version
        run: |
          grep -qx "version=${GITHUB_REF_NAME#v}" gradle.properties
          grep -q "VERSION = \"${GITHUB_REF_NAME#v}\"" src/main/kotlin/io/github/rustlanglatam/zeroclaw/Version.kt
      - run: ./gradlew build
      - run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
